name: Update GitHub links after account rename

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-repo-links
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old GitHub URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/update-github-repo-links.yml')
          replacements = (
              (b'https://github.com/hanchuang0303', b'https://github.com/CiderHalo'),
              (b'http://github.com/hanchuang0303', b'https://github.com/CiderHalo'),
              (b'github.com/hanchuang0303', b'github.com/CiderHalo'),
              (b'https://raw.githubusercontent.com/hanchuang0303', b'https://raw.githubusercontent.com/CiderHalo'),
              (b'http://raw.githubusercontent.com/hanchuang0303', b'https://raw.githubusercontent.com/CiderHalo'),
              (b'raw.githubusercontent.com/hanchuang0303', b'raw.githubusercontent.com/CiderHalo'),
              (b'https://api.github.com/repos/hanchuang0303', b'https://api.github.com/repos/CiderHalo'),
              (b'http://api.github.com/repos/hanchuang0303', b'https://api.github.com/repos/CiderHalo'),
              (b'api.github.com/repos/hanchuang0303', b'api.github.com/repos/CiderHalo'),
              (b'https://hanchuang0303.github.io', b'https://ciderhalo.github.io'),
              (b'http://hanchuang0303.github.io', b'https://ciderhalo.github.io'),
              (b'hanchuang0303.github.io', b'ciderhalo.github.io'),
          )

          result = subprocess.run(
              ['git', 'grep', '-Il', 'hanchuang0303', '--', '.'],
              capture_output=True,
              text=True,
              check=False,
          )
          files = [Path(p) for p in result.stdout.splitlines() if p.strip()]
          changed = []

          for path in files:
              if path == workflow or not path.is_file():
                  continue
              data = path.read_bytes()
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(f'  - {path}')

          if not changed:
              print('No old GitHub URLs required replacement.')
          PY

      - name: Remove this one-time workflow
        shell: bash
        run: rm -f .github/workflows/update-github-repo-links.yml

      - name: Verify old URLs are gone
        shell: bash
        run: |
          set -e
          if git grep -n -E 'github\.com/hanchuang0303|raw\.githubusercontent\.com/hanchuang0303|api\.github\.com/repos/hanchuang0303|hanchuang0303\.github\.io' -- .; then
            echo 'Old GitHub URL references still exist. Refusing to commit.'
            exit 1
          fi
          echo 'Verification passed: no old GitHub URL references remain.'

      - name: Commit changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: update GitHub links after account rename'
          git push
