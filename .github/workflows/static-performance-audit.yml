name: Static performance audit

on:
  pull_request:
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/audit-static-assets.py"
      - "scripts/build-web-images.py"
      - "edgeone.json"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/audit-static-assets.py"
      - "scripts/build-web-images.py"
      - "edgeone.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit static assets
        run: python3 scripts/audit-static-assets.py

      - name: Run timetable converter tests
        run: node tests/timetable-converter.test.js
