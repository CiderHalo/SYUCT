name: Update GitHub repository stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-github-repository-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Sync repository stats
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          echo "Reading repository stats for ${GITHUB_REPOSITORY}..."

          repo_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}")"

          stars="$(jq -r '.stargazers_count' <<<"$repo_json")"
          forks="$(jq -r '.forks_count' <<<"$repo_json")"

          echo "GitHub reports: ${stars} stars, ${forks} forks."

          old_json_stars="-1"
          old_json_forks="-1"

          if [[ -f "assets/github-stats.json" ]]; then
            old_json_stars="$(jq -r '.stars // -1' assets/github-stats.json)"
            old_json_forks="$(jq -r '.forks // -1' assets/github-stats.json)"
          fi

          old_html_stars="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<span data-github-stars>([^<]*)</span>', text)
          print(match.group(1).strip() if match else "-1")
          PY
          )"

          old_html_forks="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<span data-github-forks>([^<]*)</span>', text)
          print(match.group(1).strip() if match else "-1")
          PY
          )"

          echo "Current JSON: ${old_json_stars} stars, ${old_json_forks} forks."
          echo "Current HTML: ${old_html_stars} stars, ${old_html_forks} forks."

          if [[ "$old_json_stars" == "$stars" \
             && "$old_json_forks" == "$forks" \
             && "$old_html_stars" == "$stars" \
             && "$old_html_forks" == "$forks" ]]; then

            echo "Stats are already synchronized."

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "stars=${stars}" >> "$GITHUB_OUTPUT"
            echo "forks=${forks}" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --argjson stars "$stars" \
            --argjson forks "$forks" \
            --arg updated_at "$updated_at" \
            '{
              stars: $stars,
              forks: $forks,
              updated_at: $updated_at
            }' > assets/github-stats.json

          STARS="$stars" FORKS="$forks" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          stars = os.environ["STARS"]
          forks = os.environ["FORKS"]

          text, star_count = re.subn(
              r'(<span data-github-stars>)[^<]*(</span>)',
              rf'\g<1>{stars}\g<2>',
              text,
              count=1,
          )

          text, fork_count = re.subn(
              r'(<span data-github-forks>)[^<]*(</span>)',
              rf'\g<1>{forks}\g<2>',
              text,
              count=1,
          )

          if star_count != 1:
              raise RuntimeError(
                  f"Expected exactly one data-github-stars element, found {star_count}"
              )

          if fork_count != 1:
              raise RuntimeError(
                  f"Expected exactly one data-github-forks element, found {fork_count}"
              )

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.json index.html

          if git diff --cached --quiet; then
            echo "No files changed."

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "stars=${stars}" >> "$GITHUB_OUTPUT"
            echo "forks=${forks}" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          git commit -m "chore: update GitHub repository stats"
          git push origin "HEAD:${TARGET_BRANCH}"

          commit_sha="$(git rev-parse HEAD)"

          echo "Updated stats:"
          echo "JSON: ${old_json_stars}/${old_json_forks} -> ${stars}/${forks}"
          echo "HTML: ${old_html_stars}/${old_html_forks} -> ${stars}/${forks}"
          echo "Created commit: ${commit_sha}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "stars=${stars}" >> "$GITHUB_OUTPUT"
          echo "forks=${forks}" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 创建的提交不会自动触发新的 GitHub Pages 工作流，
      # 因此数据发生变化时主动请求重新构建 Pages。
      - name: Rebuild GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null

          echo "GitHub Pages rebuild requested."

      # 定时运行仅在 Star/Fork 变化时触发 EdgeOne。
      # 手动运行始终触发，方便强制同步 syuct.top。
      - name: Trigger EdgeOne deployment
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EDGEONE_DEPLOY_HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EDGEONE_DEPLOY_HOOK:-}" ]]; then
            echo "::error::Repository secret EDGEONE_DEPLOY_HOOK is not configured."
            echo "Create an EdgeOne deployment hook for the main branch, then save its URL as the GitHub Actions secret EDGEONE_DEPLOY_HOOK."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --request POST \
            --output /dev/null \
            "$EDGEONE_DEPLOY_HOOK"

          echo "EdgeOne deployment hook triggered successfully."
