name: Apply v1.27 performance refactor

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: apply-v127-performance
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install image optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Apply code and page optimizations
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import re

          APP_B64 = ""
          README_B64 = ""

          Path("assets/app.js").write_bytes(base64.b64decode(APP_B64))
          Path("README.md").write_bytes(base64.b64decode(README_B64))

          rev = "20260807"
          for path in Path(".").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"\?rev=\d+", f"?rev={rev}", text)

              if path.name == "index.html":
                  preload = '<link rel="preload" as="image" href="assets/hero-campus.jpg" fetchpriority="high"/>'
                  marker = f'<link href="assets/styles.css?rev={rev}" rel="stylesheet"/>'
                  if preload not in text and marker in text:
                      text = text.replace(marker, preload + "\n" + marker, 1)
                  text = text.replace(
                      '<img alt="沈阳化工大学校园地图" src="assets/campus-map.jpg"/>',
                      '<img alt="沈阳化工大学校园地图" src="assets/campus-map.jpg" loading="lazy" decoding="async" fetchpriority="low"/>',
                      1,
                  )

              if path.name == "map.html":
                  text = text.replace(
                      '<button data-lightbox="assets/sports-map.png"><img src="assets/sports-map.png" alt="沈阳化工大学体育课专用地图"></button>',
                      '<button data-lightbox="assets/sports-map.png"><img src="assets/sports-map.png" alt="沈阳化工大学体育课专用地图" loading="lazy" decoding="async"></button>',
                      1,
                  )

              if path.name == "about.html":
                  text = text.replace(
                      '<img src="assets/qq-group.png" alt="沈阳化工大学新生交流群二维码">',
                      '<img src="assets/qq-group.png" alt="沈阳化工大学新生交流群二维码" loading="lazy" decoding="async">',
                      1,
                  )

              path.write_text(text, encoding="utf-8")

          # Keep package metadata aligned with the release; PDF.js dependency remains pinned.
          import json
          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "1.27.0"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PYCODE

      - name: Optimize image payloads without changing display logic
        shell: bash
        run: |
          set -e
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          else
            IM=convert
          fi

          for file in \
            assets/landmark-chemical-pyramid.png \
            assets/landmark-dragon-gate.png \
            assets/landmark-huaide-square.png \
            assets/landmark-library.png \
            assets/landmark-motto-stone.png \
            assets/landmark-old-school-gate.png
          do
            test -f "$file"
            tmp="${file%.png}.optimized.png"
            "$IM" "$file" -filter Lanczos -resize '900x600>' -strip \
              -define png:compression-level=9 -define png:compression-filter=5 "$tmp"
            mv "$tmp" "$file"
          done

          if [ -f assets/sports-map.png ]; then
            "$IM" assets/sports-map.png -strip \
              -define png:compression-level=9 -define png:compression-filter=5 assets/sports-map.optimized.png
            mv assets/sports-map.optimized.png assets/sports-map.png
          fi

      - name: Verify refactor
        shell: bash
        run: |
          set -e
          node --check assets/app.js
          grep -q '当前版本：v1.27' README.md
          grep -q '"version": "1.27.0"' package.json
          grep -q 'fetchpriority="high"' index.html
          grep -q 'loading="lazy" decoding="async" fetchpriority="low"' index.html
          grep -q 'OFFICE_PREVIEW_MANIFEST_URL = "assets/office-preview-manifest.json?rev=20260807"' assets/app.js
          if grep -R --include='*.html' -nE '\?rev=20260806([0-9]*)?' .; then
            echo "Old cache revision still exists in HTML."
            exit 1
          fi
          for file in assets/landmark-*.png; do
            identify "$file" | grep -q '900x600'
          done
          identify assets/sports-map.png | grep -q '1455x2048'
          echo "v1.27 verification passed."

      - name: Commit optimized release
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-v127-performance.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf: optimize static loading and assets for v1.27"
          git push

      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          for attempt in 1 2 3 4 5; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/pages/builds"; then
              echo "GitHub Pages rebuild requested."
              exit 0
            fi
            echo "Pages rebuild request is busy; retrying in 30 seconds ($attempt/5)."
            sleep 30
          done
          echo "Could not request Pages rebuild automatically. The repository commit is already complete."
