<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075ca8">
  <title>PDF 在线预览 · 沈阳化工大学校园指南</title>
  <link rel="stylesheet" href="assets/pdf-viewer.css?rev=20260807">
  <link href="assets/favicon-32.png" rel="icon" type="image/png" sizes="32x32">
  <link href="assets/apple-touch-icon.png" rel="apple-touch-icon">
</head>
<body>
  <header class="viewer-toolbar">
    <button id="backButton" class="tool-button tool-back" type="button" aria-label="返回">←</button>
    <div class="viewer-heading">
      <strong id="documentTitle">PDF 在线预览</strong>
      <span id="documentMeta">正在加载文档</span>
    </div>
    <div class="toolbar-actions">
      <button id="zoomOutButton" class="tool-button" type="button" aria-label="缩小">−</button>
      <button id="fitButton" class="tool-button tool-label" type="button">适合宽度</button>
      <button id="zoomInButton" class="tool-button" type="button" aria-label="放大">＋</button>
      <a id="downloadButton" class="tool-button tool-label" href="#" download>下载原文件</a>
    </div>
  </header>

  <main class="viewer-main">
    <section id="statusPanel" class="status-panel" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <strong id="statusTitle">正在准备本地阅读器</strong>
      <span id="statusText">预览资源由本站直接提供，不再连接外部 PDF 组件。</span>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <section id="viewerStage" class="viewer-stage" hidden>
      <div id="pageShell" class="page-shell">
        <canvas id="pdfCanvas" aria-label="PDF 页面预览"></canvas>
      </div>
    </section>

    <section id="errorPanel" class="error-panel" hidden>
      <strong>在线预览没有加载成功</strong>
      <p id="errorMessage">本地预览资源可能尚未部署完成，你仍可以下载原文件查看。</p>
      <div class="error-actions">
        <button id="retryButton" class="primary-button" type="button">重新加载</button>
        <a id="fallbackDownload" class="secondary-button" href="#" download>下载原文件查看</a>
      </div>
    </section>
  </main>

  <footer class="page-controls">
    <button id="previousButton" type="button">上一页</button>
    <label class="page-number-control">
      <input id="pageInput" type="number" inputmode="numeric" min="1" value="1" aria-label="当前页码">
      <span id="pageCount">/ 1</span>
    </label>
    <button id="nextButton" type="button">下一页</button>
  </footer>

  <noscript>需要启用 JavaScript 才能在线预览 PDF。你仍可以下载原文件。</noscript>
  <script>
    window.__pdfViewerStarted = false;
    window.setTimeout(function () {
      if (window.__pdfViewerStarted) return;
      var statusPanel = document.getElementById("statusPanel");
      var viewerStage = document.getElementById("viewerStage");
      var errorPanel = document.getElementById("errorPanel");
      var errorMessage = document.getElementById("errorMessage");
      if (statusPanel) statusPanel.hidden = true;
      if (viewerStage) viewerStage.hidden = true;
      if (errorPanel) errorPanel.hidden = false;
      if (errorMessage) {
        errorMessage.textContent = "阅读器入口脚本没有成功加载。请确认当前部署中存在 assets/pdf-viewer.js?rev=20260807，并刷新 EdgeOne 缓存。";
      }
    }, 12000);
  </script>
  <script type="module" src="assets/pdf-viewer.js?rev=20260807"></script>
</body>
</html>
